<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seasonal Showcase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body onload="function_spring()">
    <div class="nav-bar">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="explore_trees.html">Tree Explorer</a>
      <a class="nav-link" href="seasonal_showcase.html">Seasonal Showcase</a>
      <a class="nav-link" href="quiz.html">Tree Quiz</a>
      <a class="nav-link" href="map.html">Tree Map</a>
    </div>
    <div class="season-container">
        <div class="image-container">
            <img class="season-image" src="trees/Seasons/Autumn.jpg" alt="Autumn" />
            <!-- <div class="caption">Autumn</div> -->
        </div>
        <div class="btn-container">
            <button class="btn-primary btn-style btn-style1" onclick="function_spring()">SPRING</button>
            <button class="btn-primary btn-style btn-style2" onclick="function_summer()">SUMMER</button>
            <button class="btn-primary btn-style btn-style3" onclick="function_autumn()">AUTUMN</button>
            <button class="btn-primary btn-style btn-style4" onclick="function_winter()">WINTER</button>
        </div>
    </div>
</body>
<script>
    function function_spring() {
        document.querySelector('.season-image').src = 'trees/Seasons/Spring.jpg';
        document.querySelector('.btn-style1').style.backgroundColor = 'rgb(6, 62, 2)';
        document.querySelector('.btn-style1').style.color = 'white';
        document.querySelector('.btn-style2').style.backgroundColor = '';
        document.querySelector('.btn-style2').style.color = '';
        document.querySelector('.btn-style3').style.backgroundColor = '';
        document.querySelector('.btn-style3').style.color = '';
        document.querySelector('.btn-style4').style.backgroundColor = '';
        document.querySelector('.btn-style4').style.color = '';
    }
    function function_summer() {
        document.querySelector('.season-image').src = 'trees/Seasons/Summer.jpg';
        document.querySelector('.btn-style2').style.backgroundColor = 'rgb(6, 62, 2)';
        document.querySelector('.btn-style2').style.color = 'white';
        document.querySelector('.btn-style1').style.backgroundColor = '';
        document.querySelector('.btn-style1').style.color = '';
        document.querySelector('.btn-style3').style.backgroundColor = '';
        document.querySelector('.btn-style3').style.color = '';
        document.querySelector('.btn-style4').style.backgroundColor = '';
        document.querySelector('.btn-style4').style.color = '';
    }
    function function_autumn() {
        document.querySelector('.season-image').src = 'trees/Seasons/Autumn.jpg';
        document.querySelector('.btn-style3').style.backgroundColor = 'rgb(6, 62, 2)';
        document.querySelector('.btn-style3').style.color = 'white';
        document.querySelector('.btn-style1').style.backgroundColor = '';
        document.querySelector('.btn-style1').style.color = '';
        document.querySelector('.btn-style2').style.backgroundColor = '';
        document.querySelector('.btn-style2').style.color = '';
        document.querySelector('.btn-style4').style.backgroundColor = '';
        document.querySelector('.btn-style4').style.color = '';

    }
    function function_winter() {
        document.querySelector('.season-image').src = 'trees/Seasons/Winter.jpg';
        document.querySelector('.btn-style4').style.backgroundColor = 'rgb(6, 62, 2)';
        document.querySelector('.btn-style4').style.color = 'white';
        document.querySelector('.btn-style1').style.backgroundColor = '';
        document.querySelector('.btn-style1').style.color = '';
        document.querySelector('.btn-style2').style.backgroundColor = '';
        document.querySelector('.btn-style2').style.color = '';
        document.querySelector('.btn-style3').style.backgroundColor = '';
        document.querySelector('.btn-style3').style.color = '';

    }

    
</script>
</html>
