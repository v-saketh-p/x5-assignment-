<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seasonal Showcase</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body onload="function_spring('oak');generateButtons()">
    <div class="nav-bar">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="explore_trees.html">Tree Explorer</a>
      <a class="nav-link" href="seasonal_showcase.html">Seasonal Showcase</a>
      <a class="nav-link" href="quiz.html">Tree Quiz</a>
      <a class="nav-link" href="map.html">Tree Map</a>
    </div>
    <div class="tree-name">Oak Tree</div>
    <div class="season-container">
      <div class="dropdown-container">  
        <div class="dropdown mb-3">
          <button
            class="btn btn-secondary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            Native
          </button>
          <ul class="dropdown-menu drop1"></ul>
        </div>

        <div class="dropdown">
          <button
            class="btn btn-secondary dropdown-toggle"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            Non-Native
          </button>
          <ul class="dropdown-menu drop2"></ul>
        </div>
      </div>

      <div class="image-container">
        <img class="season-image" src="" alt="Autumn" />
      </div>
      <div class="btn-container">
        <div class="season-label"></div>
        <button
          class="btn-primary btn-style btn-style1"
          onclick="function_spring(cur)"
        >
          SPRING
        </button>
        <button
          class="btn-primary btn-style btn-style2"
          onclick="function_summer(cur)"
        >
          SUMMER
        </button>
        <button
          class="btn-primary btn-style btn-style3"
          onclick="function_autumn(cur)"
        >
          AUTUMN
        </button>
        <button
          class="btn-primary btn-style btn-style4"
          onclick="function_winter(cur)"
        >
          WINTER
        </button>
      </div>
    </div>
  </body>
  <script>
    const data = {
      native: [
        "Alder Tree",
        "Ash Tree",
        "Hawthorn Tree",
        "Beech Tree",
        "Hazel Tree",
        "Holly Tree",
        "Willow Tree",
        "Oak Tree",
        "Rowan Tree",
        "Scots Pine Tree",
        "Silver Birch Tree",
        "Yew Tree",
      ],
      nonnative: [
        "Douglas Fir Tree",
        "Horse Chestnut Tree",
        "Larch Tree",
        "Sweet Chestnut Tree",
        "Sycamore Tree",
      ],
    };

    const season_images = {
      alder: {
        spring: "trees/Seasons/Alder_spring.jpeg",
        summer: "trees/Seasons/Alder_summer.jpeg",
        autumn: "trees/Seasons/Alder_autumn.jpeg",
        winter: "trees/Seasons/Alder_winter.jpeg",
      },
      ash: {
        spring: "trees/Seasons/Ash_Spring.jpeg",
        summer: "trees/Seasons/Ash_summer.jpg",
        autumn: "trees/Seasons/Ash_Autumn.jpeg",
        winter: "trees/Seasons/Ash_winter.jpeg",
      },
      larch: {
        spring: "trees/Seasons/larch_spring.jpeg",
        summer: "trees/Seasons/larch_summer.jpg",
        autumn: "trees/Seasons/larch_autumn.jpeg",
        winter: "trees/Seasons/larch_winter.jpeg",
      },
      oak: {
        spring: "trees/Seasons/Oak_Spring.jpg",
        summer: "trees/Seasons/Oak_Summer.jpg",
        autumn: "trees/Seasons/Oak_Autumn.jpg",
        winter: "trees/Seasons/Oak_Winter.jpg",
      },
      sycamore: {
        spring: "trees/Seasons/sycamore_spring.jpeg",
        summer: "trees/Seasons/sycamore_summer.jpeg",
        autumn: "trees/Seasons/sycamore_autumn.jpeg",
        winter: "trees/Seasons/sycamore_winter.jpeg",
      },
    };

    let cur = "oak";
    console.log(season_images[cur].spring);

    function function_spring(cur) {
      document.querySelector(".season-image").src = season_images[cur].spring;
      document.querySelector(".btn-style1").style.backgroundColor = "green";
      document.querySelector(".btn-style1").style.color = "white";
      document.querySelector(".btn-style2").style.backgroundColor = "";
      document.querySelector(".btn-style2").style.color = "";
      document.querySelector(".btn-style3").style.backgroundColor = "";
      document.querySelector(".btn-style3").style.color = "";
      document.querySelector(".btn-style4").style.backgroundColor = "";
      document.querySelector(".btn-style4").style.color = "";
    }
    function function_summer(cur) {
      document.querySelector(".season-image").src = season_images[cur].summer;
      document.querySelector(".btn-style2").style.backgroundColor = "green";
      document.querySelector(".btn-style2").style.color = "white";
      document.querySelector(".btn-style1").style.backgroundColor = "";
      document.querySelector(".btn-style1").style.color = "";
      document.querySelector(".btn-style3").style.backgroundColor = "";
      document.querySelector(".btn-style3").style.color = "";
      document.querySelector(".btn-style4").style.backgroundColor = "";
      document.querySelector(".btn-style4").style.color = "";
    }
    function function_autumn(cur) {
      document.querySelector(".season-image").src = season_images[cur].autumn;
      document.querySelector(".btn-style3").style.backgroundColor = "green";
      document.querySelector(".btn-style3").style.color = "white";
      document.querySelector(".btn-style1").style.backgroundColor = "";
      document.querySelector(".btn-style1").style.color = "";
      document.querySelector(".btn-style2").style.backgroundColor = "";
      document.querySelector(".btn-style2").style.color = "";
      document.querySelector(".btn-style4").style.backgroundColor = "";
      document.querySelector(".btn-style4").style.color = "";
    }
    function function_winter(cur) {
      document.querySelector(".season-image").src = season_images[cur].winter;
      document.querySelector(".btn-style4").style.backgroundColor = "green";
      document.querySelector(".btn-style4").style.color = "white";
      document.querySelector(".btn-style1").style.backgroundColor = "";
      document.querySelector(".btn-style1").style.color = "";
      document.querySelector(".btn-style2").style.backgroundColor = "";
      document.querySelector(".btn-style2").style.color = "";
      document.querySelector(".btn-style3").style.backgroundColor = "";
      document.querySelector(".btn-style3").style.color = "";
    }

    function generateButtons() {
      document.getElementsByClassName("drop1")[0].innerHTML = "";
      data.native.forEach(function (tree) {
        const li = document.createElement("li");
        const button = document.createElement("button");
        button.className = "dropdown-item";
        button.type = "button";
        button.innerText = tree;
        li.appendChild(button);
        document.getElementsByClassName("drop1")[0].appendChild(li);
        button.addEventListener("click", function () {
          document.querySelector(".tree-name").innerText = tree;
          cur = tree.toLowerCase().split(" ")[0];
          function_spring(cur);
        });
      });
      document.getElementsByClassName("drop2")[0].innerHTML = "";
      data.nonnative.forEach(function (tree) {
        const li = document.createElement("li");
        const button = document.createElement("button");
        button.className = "dropdown-item";
        button.type = "button";
        button.innerText = tree;
        li.appendChild(button);
        document.getElementsByClassName("drop2")[0].appendChild(li);
        button.addEventListener("click", function () {
          document.querySelector(".tree-name").innerText = tree;
          cur = tree.toLowerCase().split(" ")[0];
          function_spring(cur);
        });
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</html>
