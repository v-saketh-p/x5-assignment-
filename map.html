<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tree Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />

    <style>
        #map {
            height: 570px;
            width: 43%;
            box-shadow: 6px 8px 10px rgb(99, 48, 0);
            margin-top: 90px;
            margin-left: auto;
            margin-right: auto;
            border-radius:15px ;
        }
        .buttons {
            margin: 20px;
            text-align: center;
        }
        .buttons button {
            margin-right: 10px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
  </head>
  <body onload="generateButtons()">
    <div class="nav-bar">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="explore_trees.html">Tree Explorer</a>
      <a class="nav-link" href="seasonal_showcase.html">Seasonal Showcase</a>
      <a class="nav-link" href="quiz.html">Tree Quiz</a>
      <a class="nav-link" href="map.html">Tree Map</a>
    </div>
    <div class="tree-name">Oak Tree</div>
    <h1>Explore Tree Distribution Across the UK 🌿</h1>
    <div class="dropdown-container">
  <div class="dropdown mb-3">
    <button
      class="btn btn-secondary dropdown-toggle"
      type="button"
      data-bs-toggle="dropdown"
      aria-expanded="false"
    >
      Native
    </button>
    <ul class="dropdown-menu drop1">
    </ul>
  </div>

  <div class="dropdown">
    <button
      class="btn btn-secondary dropdown-toggle"
      type="button"
      data-bs-toggle="dropdown"
      aria-expanded="false"
    >
       Non-Native
    </button>
    <ul class="dropdown-menu drop2">
      
    </ul>
  </div>
</div>


    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
      // Initialize map
      const map = L.map("map").setView([54.5, -3], 6);

      // Add base layer
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "© OpenStreetMap contributors",
      }).addTo(map);

      const data = {
        native: ["Alder Tree","Ash Tree", "Hawthorn Tree","Beech Tree","Hazel Tree","Holly Tree","Willow Tree","Oak Tree","Rowan Tree",
         "Scots Pine Tree",
         "Silver Birch Tree",
         "Yew Tree"],
         nonnative: ["Douglas Fir Tree","Horse Chestnut Tree","Larch Tree","Sweet Chestnut Tree","Sycamore Tree"]
    };

      const treeLocations = {
        oak: [
          { lat: 52.5, lng: -1.9, name: "English Oak - Birmingham" },
          { lat: 51.5, lng: -0.1, name: "Oak - London" },
          { lat: 53.4, lng: -2.2, name: "Oak - Manchester" },
          { lat: 55.0, lng: -1.6, name: "Oak - Newcastle" },
        ],
        ash: [
          { lat: 54.0, lng: -2.2, name: "Ash - Lake District" },
          { lat: 50.9, lng: -1.4, name: "Ash - Southampton" },
          { lat: 52.2, lng: -0.1, name: "Ash - Peterborough" },
          { lat: 53.0, lng: -2.0, name: "Ash - Manchester" },
        ],
        willow: [
          { lat: 53.5, lng: -1.0, name: "Willow - Sheffield" },
          { lat: 51.7, lng: -0.9, name: "Willow - Oxford" },
          { lat: 52.9, lng: -1.5, name: "Willow - Nottingham" },
          { lat: 54.2, lng: -3.0, name: "Willow - Cumbria" },
        ],
        alder: [
          { lat: 52.0, lng: -2.0, name: "Alder - Worcestershire" },
          { lat: 51.3, lng: -0.5, name: "Alder - Kent" },
          { lat: 53.6, lng: -2.4, name: "Alder - Lancashire" },
          { lat: 55.1, lng: -2.9, name: "Alder - Northumberland" },
        ],
        silver: [
            { lat: 56.0, lng: -3.5, name: "Birch - Northern Scotland" },
            { lat: 54.0, lng: -1.5, name: "Birch - Yorkshire" },
            { lat: 52.5, lng: -0.5, name: "Birch - East Midlands" },
            { lat: 51.0, lng: -2.0, name: "Birch - South West England" },
        ],
        scots: [
          { lat: 57.0, lng: -4.2, name: "Scots Pine - Highlands" },
          { lat: 55.9, lng: -3.2, name: "Scots Pine - Loch Lomond" },
          { lat: 54.5, lng: -2.0, name: "Scots Pine - Lake District" },
          { lat: 53.0, lng: -1.0, name: "Scots Pine - Peak District" },
        ],
        beech: [
          { lat: 53.2, lng: -2.5, name: "Beech - Peak District" },
          { lat: 51.8, lng: -1.3, name: "Beech - New Forest" },
          { lat: 52.7, lng: -0.8, name: "Beech - Northamptonshire" },
          { lat: 54.1, lng: -2.3, name: "Beech - Yorkshire Dales" },
        ],
        hawthorn: [
          { lat: 52.6, lng: -1.5, name: "Hawthorn - Coventry" },
          { lat: 50.7, lng: -1.9, name: "Hawthorn - Bournemouth" },
          { lat: 53.3, lng: -2.1, name: "Hawthorn - Cheshire" },
          { lat: 54.4, lng: -2.7, name: "Hawthorn - Cumbria" },
        ],
        yew: [
          { lat: 51.4, lng: -0.2, name: "Yew - Richmond Park" },
          { lat: 52.2, lng: -1.5, name: "Yew - Warwickshire" },
          { lat: 53.7, lng: -2.6, name: "Yew - Lancashire" },
          { lat: 55.2, lng: -3.1, name: "Yew - Scottish Borders" },
        ],
        holly: [
          { lat: 53.0, lng: -2.0, name: "Holly - Lancashire" },
          { lat: 51.5, lng: -0.3, name: "Holly - Surrey" },
          { lat: 54.3, lng: -2.5, name: "Holly - Lake District" },
          { lat: 52.8, lng: -1.0, name: "Holly - Derbyshire" },
        ],
        hazel: [
          { lat: 54.3, lng: -2.8, name: "Hazel - Cumbria" },
          { lat: 52.4, lng: -1.8, name: "Hazel - Leicestershire" },
          { lat: 51.6, lng: -0.6, name: "Hazel - Buckinghamshire" },
          { lat: 53.8, lng: -2.3, name: "Hazel - Greater Manchester" },
        ],
        rowan: [
          { lat: 55.0, lng: -3.0, name: "Rowan - Scottish Borders" },
          { lat: 53.8, lng: -1.6, name: "Rowan - Northumberland" },
          { lat: 52.9, lng: -0.9, name: "Rowan - Lincolnshire" },
          { lat: 51.2, lng: -1.5, name: "Rowan - Wiltshire" },
        ],
        douglas: [
          { lat: 50.5, lng: -3.5, name: "Douglas Fir - Devon" },
          { lat: 51.0, lng: -4.0, name: "Douglas Fir - Cornwall" },
          { lat: 52.0, lng: -2.5, name: "Douglas Fir - Shropshire" },
          { lat: 53.5, lng: -2.8, name: "Douglas Fir - Cheshire" },
        ],
        horse: [
          { lat: 52.0, lng: -0.5, name: "Horse Chestnut - Cambridgeshire" },
          { lat: 51.2, lng: -0.7, name: "Horse Chestnut - Bedfordshire" },
          { lat: 53.1, lng: -2.2, name: "Horse Chestnut - Greater Manchester" },
          { lat: 54.6, lng: -3.1, name: "Horse Chestnut - Cumbria" },
        ],
        larch: [
          { lat: 54.5, lng: -2.5, name: "Larch - North Yorkshire" },
          { lat: 53.3, lng: -1.9, name: "Larch - Derbyshire" },
          { lat: 52.1, lng: -0.8, name: "Larch - Northamptonshire" },
          { lat: 51.4, lng: -1.2, name: "Larch - Hampshire" },
        ],
        sweet: [
          { lat: 50.8, lng: -1.2, name: "Sweet Chestnut - Hampshire" },
          { lat: 51.6, lng: -0.4, name: "Sweet Chestnut - Surrey" },
          { lat: 52.3, lng: -1.0, name: "Sweet Chestnut - Oxfordshire" },
          { lat: 53.4, lng: -2.1, name: "Sweet Chestnut - Cheshire" },
        ],
        sycamore: [
          { lat: 53.4, lng: -2.3, name: "Sycamore - Cheshire" },
          { lat: 52.8, lng: -1.4, name: "Sycamore - Staffordshire" },
          { lat: 51.9, lng: -0.6, name: "Sycamore - Buckinghamshire" },
          { lat: 54.2, lng: -2.6, name: "Sycamore - Lake District" },
        ],
      };

      let markers = [];

      function showTree(treeType) {
        markers.forEach((marker) => map.removeLayer(marker));
        markers = [];

        treeLocations[treeType].forEach((loc) => {
          const marker = L.marker([loc.lat, loc.lng])
            .addTo(map)
            .bindPopup(`<b>${loc.name}</b>`);
          markers.push(marker);
        });
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds());
      }
      
      showTree("oak");

      function generateButtons(){
        document.getElementsByClassName("drop1")[0].innerHTML = "";
        data.native.forEach(function(tree){
            const li = document.createElement("li");
            const button = document.createElement("button");
            button.className = "dropdown-item";
            button.type = "button";
            button.innerText = tree;
            li.appendChild(button);
            document.getElementsByClassName("drop1")[0].appendChild(li);
            button.addEventListener("click", function() {
                document.querySelector(".tree-name").innerText = tree;
                const treeKey = tree.toLowerCase().split(' ')[0];
                console.log(treeKey);
                showTree(treeKey);
            });
        });
        document.getElementsByClassName("drop2")[0].innerHTML = "";
        data.nonnative.forEach(function(tree){
            const li = document.createElement("li");
            const button = document.createElement("button");
            button.className = "dropdown-item";
            button.type = "button";
            button.innerText = tree;
            li.appendChild(button);
            document.getElementsByClassName("drop2")[0].appendChild(li);
            button.addEventListener("click", function() {
                document.querySelector(".tree-name").innerText = tree;
                const treeKey = tree.toLowerCase().split(' ')[0];
                console.log(treeKey);
                showTree(treeKey);
            });

        });
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
