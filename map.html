      let markers = [];

      function showTree(treeType) {
        markers.forEach((marker) => map.removeLayer(marker));
        markers = [];

        treeLocations[treeType].forEach((loc) => {
          const marker = L.marker([loc.lat, loc.lng])
            .addTo(map)
            .bindPopup(`<b>${loc.name}</b>`);
          markers.push(marker);
        });
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds());
      }

      showTree("oak");

      function generateButtons() {
        document.getElementsByClassName("drop1")[0].innerHTML = "";
        data.native.forEach(function (tree) {
          const li = document.createElement("li");
          const button = document.createElement("button");
          button.className = "dropdown-item";
          button.type = "button";
          button.innerText = tree;
          li.appendChild(button);
          document.getElementsByClassName("drop1")[0].appendChild(li);
          button.addEventListener("click", function () {
            document.querySelector(".tree-name").innerText = tree;
            const treeKey = tree.toLowerCase().split(" ")[0];
            console.log(treeKey);
            showTree(treeKey);
          });
        });
        document.getElementsByClassName("drop2")[0].innerHTML = "";
        data.nonnative.forEach(function (tree) {
