<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Trees</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body onload="function_native()">
    <div class="nav-bar">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="explore_trees.html">Tree Explorer</a>
      <a class="nav-link" href="seasonal_showcase.html">Seasonal Showcase</a>
      <a class="nav-link" href="quiz.html">Tree Quiz</a>
      <a class="nav-link" href="map.html">Tree Map</a>
    </div>
    <div class="container">
      <div class="toggle-container">
        <button class="btn-native btn-primary" onclick="function_native()">
          Native
        </button>
        <button
          class="btn-non-native btn-secondary"
          onclick="function_non_native()"
        >
          Non-Native
        </button>
      </div>
      <div class="tree-container"></div>
    </div>
<div
  class="modal fade"
  id="treeModal"
  tabindex="-1"
  aria-labelledby="treeModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content" style="background-color: wheat;">
      <div class="modal-header">
        <h3 class="modal-title" id="treeModalLabel"></h3>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body d-flex flex-wrap align-items-center">
        <div class="modal-img-container flex-fill text-center">
          <img id="treeImage" src="" alt="Tree Image" class="img-fluid rounded" style="width: 450px; height: 300px;" />
        </div>
        <div class="modal-desc-container flex-fill ps-3">
          <p id="treeDesc" class="lead"></p>
        </div>
      </div>
    </div>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  <script>
    const data = {
      native: [
        {
          name: "Alder Tree",
          path: "trees/native/alder tree.jpg",
          desc: "",
        },
        {
          name: "Ash Tree",
          path: "trees/native/ash tree.jpg",
          desc: "",
        },
        {
          name: "Hawthorn Tree",
          path: "trees/native/hawthorn 2 .jpg",
          desc: "",
        },
        {
          name: "Beech Tree",
          path: "trees/native/beech tree.jpg",
          desc: "",
        },
        {
          name: "Hazel Tree",
          path: "trees/native/hazel tree.jpg",
          desc: "",
        },
        {
          name: "Holly Tree",
          path: "trees/native/holly tree.jpg",
          desc: "",
        },
        {
          name: "Willow Tree",
          path: "trees/native/willow tree.jpg",
          desc: "",
        },
        {
          name: "Oak Tree",
          path: "trees/native/oak tree.jpg",
          desc: "",
        },
        {
          name: "Rowan Tree",
          path: "trees/native/rowan tree.jpg",
          desc: "",
        },
        {
          name: "Scots Pine Tree",
          path: "trees/native/scots pine.jpg",
          desc: "",
        },
        {
          name: "Silver birch Tree",
          path: "trees/native/silver birch .jpg",
          desc: "",
        },
        {
          name: "Yew Tree",
          path: "trees/native/yew tree.jpg",
          desc: "",
        },
      ],

      "non-native": [
        {
          name: "Douglas Fir Tree",
          path: "trees/non native/douglas fir tree.jpg",
          desc: "",
        },
        {
          name: "Horse Chestnut Tree",
          path: "trees/non native/horse chestnut tree 1.jpg",
          desc: "",
        },
        {
          name: "Larch Tree",
          path: "trees/non native/larch tree.jpg",
          desc: "",
        },
        {
          name: "Sweet Chestnut Tree",
          path: "trees/non native/sweet chestnut.jpg",
          desc: "",
        },
        {
          name: "Sycamore Tree",
          path: "trees/non native/sycamore.jpg",
          desc: "",
        },
      ],
    };

    function function_native() {
      const treeContainer =
        document.getElementsByClassName("tree-container")[0];
      console.log("Native button clicked");
      render_trees("native");
      const buttons = document.querySelectorAll(".toggle-container button");
      buttons[0].className = "btn-native-changed btn-primary";
      buttons[1].className = "btn-non-native btn-secondary";
    }

    function function_non_native() {
      console.log("Non-Native button clicked");
      render_trees("non-native");
      const buttons = document.querySelectorAll(".toggle-container button");
      buttons[1].className = "btn-non-native-changed btn-secondary";
      buttons[0].className = "btn-native btn-primary";
    }

    function render_trees(category) {
      const treeContainer =
        document.getElementsByClassName("tree-container")[0];
      treeContainer.innerHTML = ""; 
      const trees = data[category];
      for (let i = 0; i < trees.length; i++) {
        const tree = trees[i];
        const treeDiv = document.createElement("button");
        treeDiv.className = "tree";
        treeDiv.style.backgroundImage = `url('${tree.path}')`;
        const nameDiv = document.createElement("div");
        nameDiv.className = "name";
        nameDiv.innerText = tree.name;
        treeDiv.appendChild(nameDiv);
        treeContainer.appendChild(treeDiv);
                  treeDiv.addEventListener("click", () => {
            document.getElementById("treeModalLabel").innerText = tree.name;
            document.getElementById("treeImage").src = tree.path;
            document.getElementById("treeDesc").innerText = tree.desc;

            const modal = new bootstrap.Modal(
              document.getElementById("treeModal")
            );
            modal.show();
          });
        }
      }
  </script>
</html>
