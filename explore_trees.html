<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Trees</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body onload="function_native()">
    <div class="nav-bar">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="explore_trees.html">Tree Explorer</a>
      <a class="nav-link" href="seasonal_showcase.html">Seasonal Showcase</a>
      <a class="nav-link" href="quiz.html">Tree Quiz</a>
      <a class="nav-link" href="map.html">Tree Map</a>
    </div>
    <div class="container">
      <div class="toggle-container">
        <button class="btn-native btn-primary" onclick="function_native()">
          Native
        </button>
        <button
          class="btn-non-native btn-secondary"
          onclick="function_non_native()"
        >
          Non-Native
        </button>
      </div>
      <div class="tree-container"></div>
    </div>
<div
  class="modal fade"
  id="treeModal"
  tabindex="-1"
  aria-labelledby="treeModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content" style="background-color: wheat;">
      <div class="modal-header">
        <h3 class="modal-title" id="treeModalLabel"></h3>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body d-flex flex-wrap align-items-center">
        <div class="modal-img-container flex-fill text-center">
          <img id="treeImage" src="" alt="Tree Image" class="img-fluid rounded" style="width: 450px; height: 300px;" />
        </div>
        <div class="modal-desc-container flex-fill ps-3">
          <p id="treeDesc" class="lead"></p>
        </div>
      </div>
    </div>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
  <script>
    const data = {
      native: [
        {
          name: "Alder Tree",
          path: "trees/native/alder tree.jpg",
          desc: "The alder is a hardy, water-loving tree often found along rivers, streams, and wetlands. It can grow up to 25 metres tall and has dark green, rounded leaves that remain late into autumn. The tree produces small cone-like fruits called catkins that release seeds in spring. Its roots contain bacteria that fix nitrogen into the soil, enriching the surrounding ecosystem. Alder wood is resistant to rot in water, making it historically useful for building bridges, foundations, and even Venice’s canals.",
        },
        {
          name: "Ash Tree",
          path: "trees/native/ash tree.jpg",
          desc: "Ash trees are tall and elegant, reaching up to 35 metres, with pale grey bark and clusters of compound leaves made up of 7–13 leaflets. Their light, flexible wood was prized for making tools, sports equipment, and furniture. The tree flowers before it grows leaves in spring, producing black seed pods known as “keys.” In Norse mythology, the World Tree (Yggdrasil) was believed to be an ash, symbolizing connection between realms. Sadly, ash trees across the UK are currently threatened by the fungal disease ash dieback.",
        },
        {
          name: "Hawthorn Tree",
          path: "trees/native/hawthorn 2 .jpg",
          desc: "Hawthorn, also called the “May tree,” is a small, tough tree commonly used in hedgerows and boundaries. In May, it bursts into clusters of fragrant white or pink flowers, followed by bright red berries known as “haws.” The flowers attract pollinators, and the berries are a valuable food source for birds in autumn. In folklore, hawthorn was believed to protect against evil spirits but was considered bad luck to bring indoors. Its dense, thorny branches make it perfect for wildlife nesting.",
        },
        {
          name: "Beech Tree",
          path: "trees/native/beech tree.jpg",
          desc: "The majestic beech can grow over 40 metres tall and forms dense forests across southern England. Its smooth grey bark and oval leaves, which turn coppery gold in autumn, make it one of the UK’s most beautiful trees. The fallen leaves form thick carpets on forest floors, creating peaceful, shaded environments. Beech nuts, called beechmast, feed birds, rodents, and deer. In mythology, beech was seen as a symbol of knowledge and learning — early writing tablets were even made from beech wood.",
        },
        {
          name: "Hazel Tree",
          path: "trees/native/hazel tree.jpg",
          desc: "Hazel is a small, spreading tree found in hedgerows and woodland edges, growing up to 12 metres tall. It produces long yellow catkins in late winter and delicious hazelnuts in autumn, which are eaten by squirrels, dormice, and jays. The flexible branches have long been used in traditional crafts such as hurdle making and wattle fencing. In Celtic mythology, hazel represented wisdom and inspiration — poets were said to gain knowledge from its nuts. Hazel coppices were once an essential part of woodland management in Britain.",
        },
        {
          name: "Holly Tree",
          path: "trees/native/holly tree.jpg",
          desc: "Holly is an evergreen tree that stands out during winter with its glossy, spiny leaves and bright red berries. It’s often used in Christmas decorations as a symbol of life and hope in the dark months. The berries provide vital winter food for birds like thrushes and blackbirds, although they’re toxic to humans. In folklore, holly was believed to ward off evil and bring good luck to homes. Its dense foliage also offers year-round shelter for small animals and nesting birds",
        },
        {
          name: "Willow Tree",
          path: "trees/native/willow tree.jpg",
          desc: "Willows thrive in damp ground near rivers, ponds, and marshes, with long, narrow leaves and graceful, drooping branches. They grow quickly and can live for many decades, providing shade and preventing soil erosion. The flexible wood has been used for basket weaving, cricket bats, and furniture. In folklore, willow trees are connected with water, the moon, and healing, often symbolizing sadness or renewal. The bark contains salicylic acid — the natural source of aspirin — linking the tree to real medicinal value.",
        },
        {
          name: "Oak Tree",
          path: "trees/native/oak tree.jpg",
          desc: "The English oak is perhaps Britain's most iconic tree, reaching up to 40 metres tall and living for hundreds, even thousands, of years. It’s easily recognized by its lobed leaves and acorns, which mature every autumn. Oaks support more life forms than any other native tree — over 2,000 species of insects, fungi, and lichens rely on them. Its strong, durable timber has been used for ships, buildings, and furniture for centuries. In folklore, the oak symbolizes strength, courage, and endurance, often considered the “king of the forest.”",
        },
        {
          name: "Rowan Tree",
          path: "trees/native/rowan tree.jpg",
          desc: "The rowan, or mountain ash, is a smaller tree known for its clusters of white flowers in spring and bright red berries in autumn. It thrives in upland areas and rocky soils, especially in Scotland and northern England. The berries attract many bird species, while its feathery leaves add elegance to the landscape. In Celtic and Norse mythology, the rowan was thought to protect against enchantment and bring good fortune. Many old cottages once had a rowan planted near the door to ward off evil spirits",
        },
        {
          name: "Scots Pine Tree",
          path: "trees/native/scots pine.jpg",
          desc: "The Scots pine is Britain's only native conifer and the national tree of Scotland. It has tall, straight trunks with orange-red bark near the top and clusters of blue-green needles that grow in pairs. Its cones release seeds that provide food for crossbills, red squirrels, and other woodland wildlife. Scots pine forests, such as the ancient Caledonian Forest, are vital habitats for rare species like capercaillie and pine marten. The tree represents resilience and endurance in Scottish heritage and landscape.",
        },
        {
          name: "Silver birch Tree",
          path: "trees/native/silver birch .jpg",
          desc: "Silver Birch is a graceful deciduous tree known for its striking white, peeling bark and light, airy branches. Its small, triangular leaves turn bright yellow in autumn, creating a stunning seasonal display before they fall. Often one of the first trees to grow in open ground, it plays a key role in helping new woodland develop. The tree supports a rich variety of wildlife, including insects, birds, and fungi. In folklore, silver birch was seen as a symbol of renewal and protection, and people believed it could ward off negative energy and bring fresh beginnings.",
        },
        {
          name: "Yew Tree",
          path: "trees/native/yew tree.jpg",
          desc: "Yew is an ancient evergreen tree recognised by its deep green needle-like leaves and distinctive red berry-like arils. It remains vibrant throughout winter and is often found in historic churchyards, symbolising endurance and eternal life. Although the fleshy arils are eaten by birds, the seeds and foliage are highly toxic to humans and animals. Yew trees can live for thousands of years, making them one of Britain’s oldest living species. Their dense branches offer all-year shelter for wildlife, and the tree has long been linked with mystery, folklore, and the idea of immortality.",
        },
      ],

      "non-native": [
        {
          name: "Douglas Fir Tree",
          path: "trees/non native/douglas fir tree.jpg",
          desc: "he Douglas fir is a tall evergreen conifer introduced from North America in the 1800s. It can grow to over 60 metres, making it one of the tallest trees in the UK. The tree has soft, flat needles with a pleasant citrus scent and distinctive cones with three-pointed bracts. Its strong, lightweight timber is highly valued for construction and joinery. Douglas fir forests are also important habitats for birds and insects, adding diversity to British woodlands. The species thrives in the damp, mild climate of western Britain, especially in Scotland and Wales.",
        },
        {
          name: "Horse Chestnut Tree",
          path: "trees/non native/horse chestnut tree 1.jpg",
          desc: "Best known for its shiny brown “conkers,” the horse chestnut is a large, broadleaf tree that can reach 35 metres in height. It was introduced from the Balkans in the 1600s and quickly became a favourite in parks and along roadsides. The tree’s large white flower spikes in spring are followed by prickly green cases containing the seeds (conkers). Its leaves are made up of five to seven large leaflets spreading like fingers from a hand. Though the seeds are not edible for humans, they are a classic feature of childhood games and autumn traditions.",
        },
        {
          name: "Larch Tree",
          path: "trees/non native/larch tree.jpg",
          desc: "The European larch is a tall conifer that stands out because it’s deciduous — it loses its needles in winter, unlike most conifers. Its soft, bright green needles turn golden-yellow before falling in autumn, giving forests a striking seasonal glow. Introduced to Britain in the 17th century, larch became popular for timber plantations due to its fast growth and durable wood. The bark is reddish-brown and scaly, while its small cones remain on the branches for years. Larch forests provide excellent cover for wildlife, especially birds and deer.",
        },
        {
          name: "Sweet Chestnut Tree",
          path: "trees/non native/sweet chestnut.jpg",
          desc: "Brought to Britain by the Romans, the sweet chestnut produces edible nuts that ripen in spiky green shells in autumn. It’s a tall, graceful tree with long, serrated leaves and deeply furrowed bark as it matures. The nuts have been roasted and eaten for centuries, especially in rural communities. The wood is strong yet flexible and was historically used for fencing, furniture, and building frames. Sweet chestnut thrives in the warmer, southern parts of Britain, where it can live for several hundred years. In folklore, it’s often associated with harvest and abundance.",
        },
        {
          name: "Sycamore Tree",
          path: "trees/non native/sycamore.jpg",
          desc: "The sycamore is a broadleaf tree introduced from central Europe in the Middle Ages but now naturalised across the UK. It grows rapidly, reaching up to 35 metres, and has large, five-lobed leaves similar to a maple’s. Its winged seeds, known as “helicopters,” spin to the ground in autumn — a familiar childhood sight. The sycamore’s dense canopy provides shelter for wildlife, while its bark develops beautiful patches of grey, green, and cream as it ages. Although it can spread easily and sometimes dominate woodlands, it remains an important and resilient feature of Britain’s tree landscape.",
        },
      ],
    };

    function function_native() {
      const treeContainer =
        document.getElementsByClassName("tree-container")[0];
      console.log("Native button clicked");
      render_trees("native");
      const buttons = document.querySelectorAll(".toggle-container button");
      buttons[0].className = "btn-native-changed btn-primary";
      buttons[1].className = "btn-non-native btn-secondary";
    }

    function function_non_native() {
      console.log("Non-Native button clicked");
      render_trees("non-native");
      const buttons = document.querySelectorAll(".toggle-container button");
      buttons[1].className = "btn-non-native-changed btn-secondary";
      buttons[0].className = "btn-native btn-primary";
    }

    function render_trees(category) {
      const treeContainer =
        document.getElementsByClassName("tree-container")[0];
      treeContainer.innerHTML = ""; 
      const trees = data[category];
      for (let i = 0; i < trees.length; i++) {
        const tree = trees[i];
        const treeDiv = document.createElement("button");
        treeDiv.className = "tree";
        treeDiv.style.backgroundImage = `url('${tree.path}')`;
        const nameDiv = document.createElement("div");
        nameDiv.className = "name";
        nameDiv.innerText = tree.name;
        treeDiv.appendChild(nameDiv);
        treeContainer.appendChild(treeDiv);
                  treeDiv.addEventListener("click", () => {
            document.getElementById("treeModalLabel").innerText = tree.name;
            document.getElementById("treeImage").src = tree.path;
            document.getElementById("treeDesc").innerText = tree.desc;

            const modal = new bootstrap.Modal(
              document.getElementById("treeModal")
            );
            modal.show();
          });
        }
      }
  </script>
</html>
